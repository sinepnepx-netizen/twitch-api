name: Pescar Twitch

on:
  schedule:
    - cron: "*/9 * * * *"
  workflow_dispatch:

jobs:
  pescar:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar $pescar
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
        run: |
          echo "Renovando token..."

          RESPONSE=$(curl -s -X POST \
            "https://id.twitch.tv/oauth2/token" \
            -d "client_id=$TWITCH_CLIENT_ID" \
            -d "client_secret=$TWITCH_CLIENT_SECRET" \
            -d "grant_type=refresh_token" \
            -d "refresh_token=$TWITCH_REFRESH_TOKEN")

          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERRO: não foi possível renovar o token."
            echo "$RESPONSE"
            exit 1
          fi

          echo "Token renovado."

          echo "Obtendo ID do canal..."

          CHANNEL=$(curl -s \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Client-Id: $TWITCH_CLIENT_ID" \
            "https://api.twitch.tv/helix/users?login=souBolinho")

          BROADCASTER_ID=$(echo "$CHANNEL" | python3 -c "import sys,json; print(json.load(sys.stdin)['data'][0]['id'])")

          echo "Obtendo ID do bot..."

          BOT=$(curl -s \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Client-Id: $TWITCH_CLIENT_ID" \
            "https://api.twitch.tv/helix/users")

          SENDER_ID=$(echo "$BOT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data'][0]['id'])")

          echo "Enviando \$pescar..."

          RESULT=$(curl -s -X POST \
            "https://api.twitch.tv/helix/chat/messages" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Client-Id: $TWITCH_CLIENT_ID" \
            -H "Content-Type: application/json" \
            -d "{\"broadcaster_id\":\"$BROADCASTER_ID\",\"sender_id\":\"$SENDER_ID\",\"message\":\"\\$pescar\"}")

          echo "$RESULT"
